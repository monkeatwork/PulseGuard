[project]
name = "pulseguard-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "confluent-kafka>=2.3",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pulseguard-common",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27", "testcontainers>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
pulseguard-common = { path = "../../common", editable = true }
