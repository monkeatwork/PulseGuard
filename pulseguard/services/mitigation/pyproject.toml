[project]
name = "pulseguard-mitigation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "confluent-kafka>=2.3",
    "pulseguard-common[db]",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "testcontainers>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
pulseguard-common = { path = "../../common", editable = true }
