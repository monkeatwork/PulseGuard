[project]
name = "pulseguard-detection-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "shap>=0.45",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "psycopg2-binary>=2.9",
    "confluent-kafka>=2.3",
    "pulseguard-common[db]",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
pulseguard-common = { path = "../../common", editable = true }
