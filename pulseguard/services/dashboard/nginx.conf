# Serves the built dashboard and reverse-proxies the four service APIs under
# /api/*, so the browser only ever talks to one origin (no CORS, no
# host-port juggling). Upstreams are resolved per request through Docker's
# DNS, so nginx starts even before the APIs are up.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ingestion/ {
        set $up ingestion:8001;
        rewrite ^/api/ingestion/(.*)$ /$1 break;
        proxy_pass http://$up;
    }
    location /api/features/ {
        set $up feature_engine:8002;
        rewrite ^/api/features/(.*)$ /$1 break;
        proxy_pass http://$up;
    }
    location /api/detection/ {
        set $up detection_engine:8003;
        rewrite ^/api/detection/(.*)$ /$1 break;
        proxy_pass http://$up;
    }
    location /api/mitigation/ {
        set $up mitigation:8004;
        rewrite ^/api/mitigation/(.*)$ /$1 break;
        proxy_pass http://$up;
    }
    location / {
        try_files $uri /index.html;
    }
}
