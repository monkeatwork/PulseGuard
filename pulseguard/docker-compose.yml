services:
  postgres:
    image: timescale/timescaledb:2.15.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulseguard}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulseguard}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.2-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Two listeners, because a Kafka client does not talk to the address
      # it dialed -- it asks the broker for the cluster's advertised
      # addresses and reconnects to those. With only the internal listener
      # advertised as `redpanda:9092`, a client on the HOST connects to
      # localhost:9092 fine, is told "the broker is at redpanda:9092",
      # and then fails because that name resolves only inside the compose
      # network. Publishing the port is not enough; the advertised address
      # has to be reachable by the client too.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    ports:
      - "8001:8001"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
    volumes:
      # Read-only access to the benchmark corpus -- the replay adapter's
      # only real event source in this environment (no live IdP). See
      # services/ingestion/app/adapters/replay.py.
      - ./data:/srv/data:ro
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 5s
      timeout: 5s
      retries: 15

  feature_engine:
    build:
      context: .
      dockerfile: services/feature_engine/Dockerfile
    ports:
      - "8002:8002"
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 5s
      timeout: 5s
      retries: 15

  detection_engine:
    build:
      context: .
      dockerfile: services/detection_engine/Dockerfile
    ports:
      - "8003:8003"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-pulseguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulseguard}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 5s
      timeout: 5s
      retries: 15

  mitigation:
    build:
      context: .
      dockerfile: services/mitigation/Dockerfile
    ports:
      - "8004:8004"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-pulseguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulseguard}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
      IDP_WEBHOOK_URL: ${IDP_WEBHOOK_URL:-http://keycloak:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 5s
      timeout: 5s
      retries: 15

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    ports:
      - "3001:3000"
    environment:
      # Browser-side fetches go to the host's published ports, not the
      # in-network service names -- the dashboard runs in the viewer's
      # browser, outside the compose network. 127.0.0.1, not localhost:
      # this host's IPv6 loopback resolution doesn't forward correctly
      # through Docker Desktop's published ports (diagnosed directly).
      VITE_DETECTION_ENGINE_URL: http://127.0.0.1:8003
      VITE_MITIGATION_URL: http://127.0.0.1:8004
    depends_on:
      - detection_engine
      - mitigation
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg_data:
