[project]
name = "pulseguard-common"
version = "0.1.0"
description = "Shared schema, time utilities, and Redis key helpers for PulseGuard services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "river>=0.21",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pulseguard_common*"]
